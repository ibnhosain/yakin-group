services:
  # ── API (Fastify) ──────────────────────────────────────────────────────────
  - type: web
    name: yakin-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: cd ../.. && npm install -g pnpm && pnpm install --frozen-lockfile && pnpm --filter @yakin/api build && pnpm exec prisma generate
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: yakin-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PORT
        value: 3001
      - key: CORS_ORIGINS
        value: https://yakin-admin.onrender.com
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: JWT_ACCESS_EXPIRES
        value: "15m"
      - key: JWT_REFRESH_EXPIRES
        value: "7d"
      - key: MAX_LOGIN_ATTEMPTS
        value: "5"
      - key: LOCKOUT_DURATION
        value: "15"
      - key: TOTP_ISSUER
        value: "Yakin Group"
      - key: UPLOAD_DIR
        value: ./uploads
    releaseCommand: cd ../.. && pnpm exec prisma migrate deploy

  # ── Admin Panel (Next.js) ──────────────────────────────────────────────────
  - type: web
    name: yakin-admin
    runtime: node
    plan: free
    rootDir: apps/admin
    buildCommand: cd ../.. && npm install -g pnpm && pnpm install --frozen-lockfile && pnpm --filter @yakin/admin build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://yakin-api.onrender.com

# ── PostgreSQL Database ────────────────────────────────────────────────────
databases:
  - name: yakin-db
    plan: free
    databaseName: yakin_group
    user: yakin_admin
