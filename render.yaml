services:
  - type: web
    name: yakin-api
    runtime: node
    plan: free
    buildCommand: npm install -g pnpm@9 && pnpm install --frozen-lockfile && pnpm db:generate && pnpm --filter @yakin/api build
    startCommand: pnpm db:migrate:prod && pnpm db:seed && node apps/api/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: yakin-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://yakin-admin.onrender.com
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: JWT_ACCESS_EXPIRES_IN
        value: "15m"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7d"
      - key: TOTP_ISSUER
        value: "Yakin Group"
      - key: SEED_ADMIN_EMAIL
        value: admin@yakingroup.com
      - key: SEED_ADMIN_PASSWORD
        generateValue: true

  - type: web
    name: yakin-admin
    runtime: node
    plan: free
    buildCommand: npm install -g pnpm@9 && pnpm install --frozen-lockfile && pnpm --filter @yakin/admin build
    startCommand: pnpm --filter @yakin/admin start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://yakin-api.onrender.com

databases:
  - name: yakin-db
    plan: free
    databaseName: yakin_group
    user: yakin_admin
